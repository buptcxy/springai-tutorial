# ============================================================================
# Spring AI 入门教程 - 应用配置文件
# ============================================================================
# 本配置文件演示了如何将 Spring AI 的 OpenAI 模块连接到 MiniMax M2.7 模型。
# MiniMax 提供了 OpenAI 兼容的 API 接口，因此我们可以复用 Spring AI 的
# OpenAI 集成模块，只需修改 base-url 和 model 即可。
# ============================================================================

spring:
  ai:
    openai:
      # ----------------------------------------------------------------------
      # base-url：API 服务的基础地址。
      # 默认值是 https://api.openai.com，这里我们改为 MiniMax 的 OpenAI
      # 兼容端点。MiniMax 的 Token Plan Key 需要使用此端点。
      # Spring AI 会在 base-url 后面拼接 /v1/chat/completions 等路径。
      # ----------------------------------------------------------------------
      base-url: https://api.minimaxi.com

      # ----------------------------------------------------------------------
      # api-key：访问 MiniMax API 的密钥。
      # 生产环境中，建议通过环境变量注入，避免硬编码在配置文件中：
      #   api-key: ${MINIMAX_API_KEY}
      # ----------------------------------------------------------------------
      api-key: sk-cp-3h_fdeu9TZIVyDOYVN1Up3jFxlVECP9J_Tj0N0bK9ZTGOBXcvPWaq7ARh9HBF3aex2Vm2IfGHYc77u9Q6IoXGus6ittAF6GLR3Am8er2d-bsWLSw36KlITU

      chat:
        options:
          # ------------------------------------------------------------------
          # model：指定使用的模型名称。
          # MiniMax M2.7 是 MiniMax 最新的大语言模型，支持 20 万 token 上下文。
          # 在 OpenAI 兼容接口中，模型名称为 "MiniMax-M2.7"。
          # ------------------------------------------------------------------
          model: MiniMax-M2.7

          # ------------------------------------------------------------------
          # temperature：控制生成文本的随机性，取值范围 0.0 ~ 2.0。
          #   - 值越高，输出越随机、越有创造性
          #   - 值越低，输出越确定、越保守
          #   - 0.7 是一个平衡创造性和准确性的常用值
          # ------------------------------------------------------------------
          temperature: 0.7

          # ------------------------------------------------------------------
          # max-tokens：单次回复生成的最大 token 数。
          # 注意：输入 token + 输出 token 的总和不能超过模型的上下文长度。
          # MiniMax-M2.7 支持最长 204800 token 的上下文窗口。
          # ------------------------------------------------------------------
          max-tokens: 2048

          # ------------------------------------------------------------------
          # top-p：核采样参数，另一种控制随机性的方式。
          # 模型只考虑概率质量排名前 top-p 的 token。
          # 例如 top-p=0.9 表示只考虑累积概率前 90% 的 token。
          # 一般建议调整 temperature 或 top-p 其中之一，不要同时调整。
          # ------------------------------------------------------------------
          top-p: 1.0

# ============================================================================
# 服务器配置
# ============================================================================
server:
  port: 8081
